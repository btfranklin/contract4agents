name: Create Draft Release

on:
    push:
        tags:
            - "v*.*.*"

permissions:
    contents: write

jobs:
    validate-python:
        uses: ./.github/workflows/python-package.yml
        permissions:
            contents: read

    validate-editor:
        uses: ./.github/workflows/vscode-extension.yml
        permissions:
            contents: read

    draft-release:
        needs: [validate-python, validate-editor]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: ${{ github.ref }}
            - name: Download validated VSIX
              uses: actions/download-artifact@v8
              with:
                  name: contract4agents-vscode-vsix
                  path: editors/vscode/dist
            - name: Generate release notes
              uses: btfranklin/release-notes-scribe@v0
              with:
                  openai_api_key: ${{ secrets.OPENAI_API_KEY }}
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  draft: "true"
                  create_release: "true"
                  include_github_generated_notes: "true"
            - name: Upload VSIX release asset
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh release upload "$GITHUB_REF_NAME" \
                      editors/vscode/dist/contract4agents-vscode-*.vsix \
                      --clobber
