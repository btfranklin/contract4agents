# Publish the built Python package to PyPI when a GitHub Release is published.
# For more information, see https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries

name: Upload Python Package

on:
    release:
        types: [published]

permissions:
    contents: read

jobs:
    publish:
        runs-on: ubuntu-latest
        environment: release
        permissions:
            # IMPORTANT: this permission is mandatory for trusted publishing
            id-token: write

        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: ${{ github.event.release.tag_name }}
            - name: Set up Node
              uses: actions/setup-node@v7
              with:
                  node-version: "22"
                  cache: npm
                  cache-dependency-path: tests/typescript/package-lock.json
            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.11"
            - name: Install PDM
              uses: pdm-project/setup-pdm@v4
              with:
                  cache: true
                  cache-dependency-path: pdm.lock
            - name: Install dependencies
              run: |
                  pdm install --group dev --group openai --group strands --group google-adk
                  npm ci --prefix tests/typescript
            - name: Validate released Python package
              run: pdm run validate:python
            - name: Test released CLI paths
              run: pdm run smoke:cli
            - name: Build package
              run: pdm build
            - name: Verify package contents
              run: pdm run package-check
            - name: Publish package with Trusted Publishing
              uses: pypa/gh-action-pypi-publish@release/v1
